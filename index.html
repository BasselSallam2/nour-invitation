<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B2C">
<title>Nour &amp; Nour, on the Nile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1B2C; --deep:#1F3A52; --mist:#C9D6E3; --moon:#E8C989; --white:#F5F7FA;
  --serif:"Cormorant Garamond", "Times New Roman", serif;
  --sans:"Jost", "Helvetica Neue", Arial, sans-serif;
  --col:34rem;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--mist);font:300 1.0625rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100svh}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--moon);outline-offset:4px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--moon)}
button{font:inherit;color:inherit}

/* Fixed sky / water backdrop, split by the horizon */
.backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none}
.backdrop .sky{position:absolute;inset:0 0 50% 0;background:
  radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
  radial-gradient(1px 1px at 28% 42%,#fff6 50%,transparent 51%),
  radial-gradient(1.4px 1.4px at 46% 12%,#fff9 50%,transparent 51%),
  radial-gradient(1px 1px at 63% 33%,#fff5 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 81% 22%,#fff8 50%,transparent 51%),
  radial-gradient(1px 1px at 91% 46%,#fff5 50%,transparent 51%),
  radial-gradient(1px 1px at 7% 38%,#fff5 50%,transparent 51%),
  linear-gradient(to bottom,#0a1422,var(--night) 70%,#14283d)}
.backdrop .water{position:absolute;inset:50% 0 0 0;background:linear-gradient(to bottom,#1a3149,var(--deep) 30%,#0f2236)}
.backdrop .horizon{opacity:.35;position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,#E8C98955 20%,#F5F7FAaa 50%,#E8C98955 80%,transparent)}
.shore .moon{position:absolute;right:12%;top:14%;width:clamp(48px,9vw,92px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff6e0,var(--moon) 70%);box-shadow:0 0 60px 10px #E8C98933}
.shore .glade{position:absolute;right:calc(12% + clamp(48px,9vw,92px)/2 - 20px);top:50%;width:40px;height:40%;background:radial-gradient(50% 100% at 50% 0,#E8C98955,transparent);filter:url(#ripple-soft) blur(6px);opacity:.8}

/* Shore (the opening) */
.shore{position:relative;height:100svh;min-height:520px;display:grid;grid-template-rows:1fr 1fr;text-align:center;overflow:hidden}
.shore .above{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 16px}
.pre{font:400 .95rem/1.4 var(--sans);letter-spacing:.04em;color:var(--mist);margin:0 0 .4rem;opacity:.85}
.name{font:300 clamp(5rem,26vw,14rem)/.82 var(--serif);color:var(--white);margin:0;letter-spacing:-.01em}
.shore .waterline{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:italic 300 1.6rem/1 var(--serif);color:var(--moon);background:transparent;padding:0 .6rem;z-index:2}
.shore .below{position:relative}
.reflection{display:block;font:300 clamp(5rem,26vw,14rem)/.82 var(--serif);color:var(--white);transform:scaleY(-1);margin-top:2px;
  opacity:0;filter:url(#ripple) blur(.4px);
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 95%);mask-image:linear-gradient(to top,#000 10%,transparent 95%)}
.open .reflection{opacity:.62;transition:opacity 1.6s ease-out}
.touch{position:absolute;inset:0;width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}
.touch span{font:400 1rem/1 var(--sans);letter-spacing:.06em;color:var(--white);border:1px solid #C9D6E366;border-radius:999px;padding:.85rem 1.4rem;background:#0E1B2C66;backdrop-filter:blur(4px)}
.touch:focus-visible{outline:none}
.touch:focus-visible span{outline:2px solid var(--moon);outline-offset:4px}
.open .touch{pointer-events:none}
.open .touch span{opacity:0;transition:opacity .5s}
.skip{position:absolute;bottom:calc(1.4rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:none;border:0;color:var(--mist);font:400 .85rem/1 var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:.6rem}
.open .skip{display:none}
.cue{position:absolute;bottom:calc(2rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;color:var(--white);font:400 .9rem/1.3 var(--sans);text-decoration:none;text-align:center;transition:opacity 1s 1.2s}
.cue small{display:block;font:italic 300 1.15rem var(--serif);color:var(--mist)}
.open .cue{opacity:1;pointer-events:auto}
.rings{position:absolute;inset:0;pointer-events:none;overflow:visible}
.rings ellipse{fill:none;stroke:#F5F7FA;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:ring 2.2s cubic-bezier(.2,.6,.3,1) forwards;opacity:0}
@keyframes ring{0%{transform:scale(.05);opacity:.9}100%{transform:scale(1);opacity:0}}
.couple-line{position:absolute;left:0;right:0;top:calc(50% + 2.2rem + clamp(4rem,21vw,11.5rem));font:400 1rem/1.4 var(--sans);color:var(--mist);opacity:0;transition:opacity 1.2s .9s;padding:0 16px}
.open .couple-line{opacity:1}

/* Sections: content above, title reflected below a local waterline */
main{position:relative}
.sec{max-width:var(--col);margin:0 auto;padding:7rem 16px 2rem}
.sec h2{font:300 clamp(2.4rem,9vw,3.6rem)/1 var(--serif);color:var(--white);margin:0;text-align:center}
.sec .wl{height:1px;margin:.55rem auto 0;width:min(100%,22rem);background:linear-gradient(90deg,transparent,#C9D6E3aa,transparent)}
.sec .mir{font:300 clamp(2.4rem,9vw,3.6rem)/1 var(--serif);color:var(--white);text-align:center;transform:scaleY(-1);opacity:.2;height:.62em;overflow:hidden;filter:url(#ripple-soft) blur(.5px);
  -webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%);margin-bottom:2.2rem;user-select:none}
.sec p{margin:0 0 1.1rem;text-wrap:pretty}
.lede{font:400 1.45rem/1.5 var(--serif);color:var(--white);text-align:center}
.center{text-align:center}

.dateline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;margin:2.4rem 0 1rem;text-align:center}
.dateline .side{font:400 .95rem/1.35 var(--sans);color:var(--mist)}
.dateline .side:first-child{text-align:right}
.dateline .side:last-child{text-align:left}
.dateline .day{font:300 5.2rem/.9 var(--serif);color:var(--moon);padding:0 .9rem;border-left:1px solid #C9D6E340;border-right:1px solid #C9D6E340}

/* Countdown: moon + numbers on the waterline */
.moonbox{display:flex;justify-content:center;margin:0 0 1.6rem}
.moonbox svg{width:150px;height:150px;overflow:visible}
.moonbox .lit{fill:var(--moon);filter:drop-shadow(0 0 14px #E8C98966);transition:d .8s}
.moonbox .dark{fill:#173049;stroke:#C9D6E322}
.cd{display:flex;justify-content:center;gap:clamp(.9rem,5vw,2.4rem);position:relative}
.cd::before{content:"";position:absolute;left:0;right:0;top:3.15rem;height:1px;background:linear-gradient(90deg,transparent,#F5F7FAaa 20%,#F5F7FAaa 80%,transparent)}
.u{display:flex;flex-direction:column;align-items:center;min-width:3.6rem}
.u .n{font:300 3.4rem/1 var(--serif);color:var(--white);font-variant-numeric:lining-nums tabular-nums;height:3.15rem;display:flex;align-items:flex-end}
.u .n.m{transform:scaleY(-1);opacity:.28;filter:blur(1.4px);margin-top:.1rem;-webkit-mask-image:linear-gradient(to top,#000,transparent 85%);mask-image:linear-gradient(to top,#000,transparent 85%)}
.u .l{font:400 .8rem/1 var(--sans);letter-spacing:.06em;color:var(--mist);margin-top:.2rem}
.phase-msg{text-align:center;font:400 1.5rem/1.45 var(--serif);color:var(--white);margin:0 auto;max-width:26rem}
.cd-wrap[data-phase="before"] .phase-msg{display:none}
.cd-wrap:not([data-phase="before"]) .cd{display:none}

/* Lanterns */
.lake{position:relative;height:150px;margin:1.6rem 0 0;border-bottom:1px solid #C9D6E333}
.lantern{position:absolute;bottom:22px;width:26px;height:34px;margin-left:-13px;transition:left 1.8s cubic-bezier(.45,.05,.25,1)}
.lantern i{position:absolute;inset:0;border-radius:40% 40% 30% 30%;background:radial-gradient(circle at 50% 60%,#fff3d1,var(--moon) 55%,#b78d45);box-shadow:0 0 22px 6px #E8C98955}
.lantern b{position:absolute;left:3px;right:3px;top:38px;height:40px;background:linear-gradient(to bottom,#E8C98966,transparent);filter:blur(3px)}
.lake.met .lantern i{box-shadow:0 0 40px 14px #E8C98977}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.25rem;border-radius:999px;border:1px solid #C9D6E370;background:transparent;color:var(--white);text-decoration:none;font:400 .95rem/1.1 var(--sans);letter-spacing:.02em;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:#F5F7FA12;border-color:var(--mist)}
.btn.gold{background:var(--moon);border-color:var(--moon);color:var(--night);font-weight:500}
.btn.gold:hover{background:#f1d8a3}

/* Location */
.venue{text-align:center}
.venue address{font-style:normal;font-size:1.15rem;color:var(--white);margin-bottom:1.4rem}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}

footer{text-align:center;padding:6rem 16px calc(7rem + env(safe-area-inset-bottom))}
.mono{display:inline-flex;flex-direction:column;align-items:center;font:300 3.2rem/.8 var(--serif);color:var(--moon)}
.mono .m2{transform:scaleY(-1);opacity:.35;filter:blur(.6px)}
.mono .amp{font:italic 300 1rem/1 var(--serif);color:var(--mist);margin:.5rem 0}
footer p{margin:.4rem 0;font-size:.95rem}
.hashtag{font:italic 400 1.4rem var(--serif);color:var(--white)}

/* Moon player */
.player{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:10;width:56px;height:56px;border-radius:50%;border:1px solid #C9D6E355;background:#0E1B2Ccc;backdrop-filter:blur(6px);cursor:pointer;padding:6px;display:none}
.open .player{display:block}
.player svg{width:100%;height:100%;display:block}
.player .lit{fill:var(--moon)}
.player .dark{fill:#21405d}
.player.playing{box-shadow:0 0 24px 2px #E8C98944}

@media (min-width:900px){
  :root{--col:40rem}
  .sec{padding-top:9rem}
}
</style>
</head>
<body class="locked">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="ripple" x="-10%" y="-10%" width="120%" height="140%">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.01 0.08" numOctaves="2" seed="4">
      <animate class="smil" attributeName="baseFrequency" dur="10s" values="0.01 0.08;0.012 0.1;0.01 0.08" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap id="disp" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ripple-soft" x="-5%" y="-10%" width="110%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.12" numOctaves="1" seed="9">
      <animate class="smil" attributeName="baseFrequency" dur="12s" values="0.012 0.12;0.015 0.15;0.012 0.12" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="backdrop" aria-hidden="true"><div class="sky"></div><div class="water"></div><div class="horizon"></div></div>

<header class="shore" id="shore">
  <div class="moon" aria-hidden="true"></div><div class="glade" aria-hidden="true"></div>
  <div class="above">
    <p class="pre" data-bind="preline"></p>
    <h1 class="name"><span data-bind="p1"></span><span class="sr"> and </span><span class="sr" data-bind="p2"></span></h1>
  </div>
  <div class="below">
    <span class="reflection" aria-hidden="true" data-bind="p2"></span>
  </div>
  <p class="couple-line" data-bind="coupleLine"></p>
  <svg class="rings" aria-hidden="true"></svg>
  <button class="touch" id="touch" type="button"><span>Touch the water</span></button>
  <button class="skip" id="skip" type="button">Skip to the details</button>
  <a class="cue" href="#invitation"><small>the evening is below</small>Read on</a>
</header>

<main id="main">
  <section class="sec" id="invitation" aria-labelledby="h-inv">
    <h2 id="h-inv">Two lights, one name</h2><div class="wl"></div><div class="mir" aria-hidden="true">Two lights, one name</div>
    <div class="dateline">
      <div class="side" data-bind="weekday"></div>
      <div class="day" data-bind="dayNum"></div>
      <div class="side" data-bind="monthYear"></div>
    </div>
    <p class="center" data-bind="timeLine"></p>
  </section>

  <section class="sec cd-wrap" id="countdown" aria-labelledby="h-cd" data-phase="before">
    <h2 id="h-cd">Until the moon is full</h2><div class="wl"></div><div class="mir" aria-hidden="true">Until the moon is full</div>
    <div class="moonbox" aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle class="dark" cx="50" cy="50" r="46"/><path class="lit" id="moonLit" d=""/></svg>
    </div>
    <div class="cd" role="group" aria-label="Time until the wedding">
      <div class="u"><span class="n" id="cd-d">00</span><span class="n m" aria-hidden="true">00</span><span class="l">days</span></div>
      <div class="u"><span class="n" id="cd-h">00</span><span class="n m" aria-hidden="true">00</span><span class="l">hours</span></div>
      <div class="u"><span class="n" id="cd-m">00</span><span class="n m" aria-hidden="true">00</span><span class="l">minutes</span></div>
      <div class="u"><span class="n" id="cd-s">00</span><span class="n m" aria-hidden="true">00</span><span class="l">seconds</span></div>
    </div>
    <p class="phase-msg" id="phaseMsg"></p>
    <div class="lake" id="lake" aria-hidden="true">
      <div class="lantern" id="lanA" style="left:8%"><i></i><b></b></div>
      <div class="lantern" id="lanB" style="left:92%"><i></i><b></b></div>
    </div>
    <p class="sr" aria-live="polite" id="cdLive"></p>
  </section>

  <section class="sec venue" id="place" aria-labelledby="h-place">
    <h2 id="h-place">Where to find us</h2><div class="wl"></div><div class="mir" aria-hidden="true">Where to find us</div>
    <address lang="ar" dir="rtl" data-bind="venueAddr"></address>
    <div class="actions"><a class="btn gold" id="mapLink" target="_blank" rel="noopener">Open in Maps</a></div>
  </section>
</main>

<footer>
  <div class="mono" aria-hidden="true"><span>N</span><span class="amp">&amp;</span><span class="m2">N</span></div>
  <p class="hashtag" data-bind="hashtag"></p>
</footer>

<button class="player" id="player" type="button" aria-label="Play our song" hidden>
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="dark" cx="50" cy="50" r="44"/><path class="lit" id="playerLit" d=""/></svg>
</button>

<script>
const INVITE = {
  lang: "en",
  arabicDigits: false,
  partner1: "Nour",
  partner2: "Nour",
  date: "2026-10-30T19:30:00+02:00",
  endTime: "2026-10-31T01:00:00+02:00",
  timezone: "Africa/Cairo",
  venue: {
    address: "شارع خدمات جمال عبدالناصر عمارة 180 الدور الخامس",
    mapsUrl: "https://www.google.com/maps?q=29.991756439208984,31.43099021911621&z=17&hl=en"
  },
  music: { src: "", title: "" },        // empty src => player hidden entirely
  hashtag: "#NourAndNour"
};

(() => {
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- time ---- */
  const override = Date.parse((new URLSearchParams(location.search).get("now") || "").replace(/ /g, "+"));
  const offset = isNaN(override) ? 0 : override - Date.now();
  const now = () => Date.now() + offset;
  const START = Date.parse(INVITE.date), END = Date.parse(INVITE.endTime);
  const phaseAt = (t) => t < START ? "before" : t < END ? "during" : "after";
  const loc = INVITE.lang + (INVITE.arabicDigits ? "-u-nu-arab" : "");
  const nf2 = new Intl.NumberFormat(loc, { minimumIntegerDigits: 2, useGrouping: false });
  const nf1 = new Intl.NumberFormat(loc, { useGrouping: false });
  const fmt = (opts, d = START) => new Intl.DateTimeFormat(INVITE.lang === "en" ? loc : INVITE.lang, { timeZone: INVITE.timezone, ...opts }).format(new Date(d));

  /* ---- bind text ---- */
  const v = INVITE.venue;
  const text = {
    p1: INVITE.partner1, p2: INVITE.partner2,
    preline: "On the Nile, " + fmt({ month: "long", day: "numeric" }),
    coupleLine: "From best friends to forever",
    weekday: fmt({ weekday: "long" }),
    dayNum: fmt({ day: "numeric" }),
    monthYear: fmt({ month: "long", year: "numeric" }),
    timeLine: "From " + fmt({ hour: "numeric", minute: "2-digit" }) + ", Cairo time",
    venueAddr: v.address,
    hashtag: INVITE.hashtag
  };
  document.querySelectorAll("[data-bind]").forEach((el) => { el.textContent = text[el.dataset.bind] ?? ""; });
  $("#mapLink").href = v.mapsUrl;

  /* ---- ripple settle (the opening) ---- */
  const disp = $("#disp");
  if (reduce) document.querySelectorAll(".smil").forEach((a) => a.remove());
  function settle() {
    if (reduce) { disp.setAttribute("scale", "3"); return; }
    const t0 = performance.now();
    (function frame(t) {
      const k = Math.min(1, (t - t0) / 2000);
      disp.setAttribute("scale", (3 + 55 * Math.pow(1 - k, 3)).toFixed(2));
      if (k < 1) requestAnimationFrame(frame);
    })(t0);
  }
  function rings(x, y) {
    if (reduce) return;
    const svg = $(".rings");
    const box = svg.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
    for (let i = 0; i < 4; i++) {
      const e = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
      e.setAttribute("cx", x - box.left); e.setAttribute("cy", y - box.top);
      e.setAttribute("rx", box.width * .7); e.setAttribute("ry", box.width * .12);
      e.style.animationDelay = i * 0.28 + "s";
      svg.append(e);
      setTimeout(() => e.remove(), 3200 + i * 300);
    }
  }
  let opened = false;
  function open(x, y) {
    if (opened) return;
    opened = true;
    if (audio) audio.play().then(() => setPlaying(true)).catch(() => {});
    document.body.classList.add("open");
    $(".shore").classList.add("open");
    rings(x, y);
    settle();
    setTimeout(() => document.body.classList.remove("locked"), reduce ? 0 : 700);
  }
  $("#touch").addEventListener("click", (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const keyboard = e.detail === 0;
    open(keyboard ? r.left + r.width / 2 : e.clientX, keyboard ? r.top + r.height * .62 : e.clientY);
    $("#main").setAttribute("tabindex", "-1");
  });
  $("#skip").addEventListener("click", () => {
    const r = $("#touch").getBoundingClientRect();
    open(r.left + r.width / 2, r.top + r.height * .6);
    document.body.classList.remove("locked");
    $("#invitation").scrollIntoView({ behavior: reduce ? "auto" : "smooth" });
    $("#h-inv").setAttribute("tabindex", "-1"); $("#h-inv").focus({ preventScroll: true });
  });

  /* ---- moon geometry: f = lit fraction, waxing (lit on the right) ---- */
  function moonPath(f, cx, cy, r) {
    if (f >= 0.995) return `M${cx},${cy - r}A${r},${r} 0 1 1 ${cx},${cy + r}A${r},${r} 0 1 1 ${cx},${cy - r}Z`;
    f = Math.max(0, f);
    const rx = Math.abs(1 - 2 * f) * r;
    return `M${cx},${cy - r}A${r},${r} 0 0 1 ${cx},${cy + r}A${rx.toFixed(2)},${r} 0 0 ${f < .5 ? 0 : 1} ${cx},${cy - r}Z`;
  }

  /* ---- lanterns drift together as the night nears (k: 1 far, 0 met) ---- */
  function lanterns(k) {
    const gap = Math.max(42 * k, 3.5);
    $("#lanA").style.left = (50 - gap) + "%";
    $("#lanB").style.left = (50 + gap) + "%";
    $("#lake").classList.toggle("met", k === 0);
  }

  /* ---- countdown ---- */
  const els = { d: $("#cd-d"), h: $("#cd-h"), m: $("#cd-m"), s: $("#cd-s") };
  const wrap = $("#countdown");
  const msgs = {
    before: "",
    during: "We are on the Nile right now, and the night has only just begun. If you're on your way, follow the lanterns.",
    after: "The water is still again. Thank you for the light you brought to our night. We'll carry it for a long time."
  };
  let lastPhase = "", lastSec = -1;
  function tick() {
    const t = now(), ph = phaseAt(t);
    if (ph !== lastPhase) {
      lastPhase = ph;
      wrap.dataset.phase = ph;
      document.body.dataset.phase = ph;
      $("#phaseMsg").textContent = msgs[ph];
      $("#h-cd").textContent = ph === "before" ? "Until the moon is full" : ph === "during" ? "The moon is full" : "After the full moon";
      wrap.querySelector(".mir").textContent = $("#h-cd").textContent;
      $("#cdLive").textContent = ph === "before" ? "" : msgs[ph];
      if (ph !== "before") { $("#moonLit").setAttribute("d", moonPath(1, 50, 50, 46)); lanterns(0); }
    }
    if (ph !== "before") return;
    const total = Math.floor((START - t) / 1000);
    if (total === lastSec) return;
    lastSec = total;
    const parts = { d: Math.floor(total / 86400), h: Math.floor(total % 86400 / 3600), m: Math.floor(total % 3600 / 60), s: total % 60 };
    for (const k in parts) {
      const s = k === "d" ? nf1.format(parts[k]).padStart(2, nf1.format(0)) : nf2.format(parts[k]);
      els[k].textContent = s;
      els[k].nextElementSibling.textContent = s;
    }
    const days = (START - t) / 864e5;
    $("#moonLit").setAttribute("d", moonPath(1 - Math.min(days, 29.5) / 29.5 * .96, 50, 50, 46));
    lanterns(Math.min(days, 30) / 30);
  }
  tick();
  setInterval(tick, 250);

  /* ---- moon player ---- */
  let audio = null;
  const player = $("#player");
  function setPlaying(p) {
    player.classList.toggle("playing", p);
    player.setAttribute("aria-label", (p ? "Pause" : "Play") + " our song" + (INVITE.music.title ? ": " + INVITE.music.title : ""));
  }
  if (INVITE.music.src) {
    audio = new Audio(INVITE.music.src);
    audio.loop = true;
    player.hidden = false;
    $("#playerLit").setAttribute("d", moonPath(0.03, 50, 50, 44));
    player.addEventListener("click", () => { audio.paused ? audio.play().then(() => setPlaying(true)).catch(() => {}) : (audio.pause(), setPlaying(false)); });
    audio.addEventListener("timeupdate", () => {
      if (audio.duration) $("#playerLit").setAttribute("d", moonPath(Math.max(.03, audio.currentTime / audio.duration), 50, 50, 44));
    });
    setPlaying(false);
  } else {
    player.remove();
  }
})();
</script>
</body>
</html>
